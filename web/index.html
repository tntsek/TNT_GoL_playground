<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TNT Game of Life</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="sidebar-open">
    <div class="app-shell">
      <main class="stage" aria-label="Simulation stage">
        <canvas id="life-canvas" aria-label="Game of Life canvas"></canvas>
        <button
          id="sidebar-show"
          class="sidebar-show"
          type="button"
          aria-label="Show controls"
          aria-controls="control-sidebar"
          aria-expanded="true"
        >
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </main>

      <aside id="control-sidebar" class="sidebar" aria-label="Simulation controls">
        <div class="sidebar-inner">
          <header class="sidebar-top">
            <pre class="sidebar-title ascii-banner" aria-label="TNT Game of Life">
 _____ _  _ _____
|_   _| \| |_   _|
  | | | .`| | |
  |_| |_|\_| |_|
~ game of life ~</pre>
            <button
              id="sidebar-hide"
              class="sidebar-hide"
              type="button"
              aria-label="Hide controls"
              aria-controls="control-sidebar"
              aria-expanded="true"
            >
              <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                <path d="M8 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </header>

          <div class="stats">
            <div class="stat"><span>Gen</span><strong id="generation-value">0</strong></div>
            <div class="stat"><span>Pop</span><strong id="population-value">0</strong></div>
            <div class="stat"><span>Cells</span><strong id="cells-value">0</strong></div>
          </div>

          <button id="play-toggle" class="primary full">Play</button>

          <div class="button-row triple">
            <button id="step-back" data-tooltip="Step backward through history.">◂ Back</button>
            <button id="step-once">Step ▸</button>
            <button id="reset-gen-zero" data-tooltip="Restore the state at generation 0 (the last randomize, clear, or edit).">Gen 0</button>
          </div>

          <div class="button-row triple">
            <button id="clear-grid">Clear</button>
            <button id="randomize-grid">Random</button>
            <button id="invert-grid" data-tooltip="Flip every cell's state (live becomes dead and vice versa).">Invert</button>
          </div>

          <label class="field">
            <span>Grid</span>
            <select id="grid-type">
              <option value="square">Square</option>
              <option value="triangle">Triangle</option>
              <option value="rhombus">Rhombus</option>
              <option value="penrose" selected>Penrose</option>
              <option value="einstein">Einstein</option>
              <option value="hex">Hex</option>
              <option value="trihex">Trihex</option>
              <option value="oct">Octagon</option>
              <option value="voronoi">Voronoi</option>
            </select>
          </label>

          <div class="field-row">
            <label class="field">
              <span>Rows</span>
              <input id="rows-input" type="number" min="4" max="1000" value="64" />
            </label>
            <label class="field">
              <span>Cols</span>
              <input id="cols-input" type="number" min="4" max="1000" value="64" />
            </label>
            <label class="field checkbox">
              <span>Wrap</span>
              <input id="wrap-toggle" type="checkbox" checked />
            </label>
          </div>

          <div class="button-row">
            <button id="apply-size">Apply Size</button>
            <button id="rebuild-map" data-tooltip="Randomizes polygon positions for Voronoi grids; redraws the tiling for other geometries.">Rebuild</button>
          </div>

          <div class="toggle-field">
            <label class="toggle-label">
              <input id="fredkin-toggle" type="checkbox" />
              <span>Fredkin (2nd order)</span>
            </label>
            <button type="button" class="info-btn" data-tooltip="Second-order reversible rule. Next state = standard life step XOR state from one generation ago. Back undoes steps exactly.">?</button>
          </div>

          <div id="voronoi-options" class="voronoi-options" hidden>
            <div class="section-title">Voronoi</div>
            <div class="button-row">
              <button id="voronoi-euclid" class="seg-btn" data-tooltip="Straight-line distance. Cells have straight bisector edges.">Euclidean</button>
              <button id="voronoi-manhattan" class="seg-btn" data-tooltip="Taxicab distance |dx|+|dy|. Cells have blocky, axis-aligned L-shaped edges.">Manhattan</button>
            </div>
            <label class="range">
              <span>Jitter <strong id="voronoi-jitter-value">70%</strong> <button type="button" class="info-btn" data-tooltip="0% = seeds on a regular grid (lattice Voronoi). 100% = seeds placed fully randomly within each cell.">?</button></span>
              <input id="voronoi-jitter" type="range" min="0" max="100" value="70" />
            </label>
          </div>

          <label class="range">
            <span>Speed <strong id="speed-value">8</strong> gen/s <button type="button" class="info-btn" data-tooltip="Generations per second — how fast the simulation steps.">?</button></span>
            <input id="speed-input" type="range" min="1" max="24" value="8" />
          </label>
          <label class="range">
            <span>Density <strong id="density-value">28%</strong> <button type="button" class="info-btn" data-tooltip="Percentage of cells to randomly fill when using Randomize.">?</button></span>
            <input id="density-input" type="range" min="5" max="95" value="28" />
          </label>
          <label class="range">
            <span>Threshold <strong id="threshold-value">140</strong> <button type="button" class="info-btn" data-tooltip="Brightness cutoff (0–255) when importing images. Pixels darker than this become live cells.">?</button></span>
            <input id="threshold-input" type="range" min="0" max="255" value="140" />
          </label>

          <div class="button-row">
            <button id="toggle-color-panel" data-tooltip="Color Mode — apply Goethean polarity or generational hue-rotation rules on top of Conway.">Colors</button>
            <button id="toggle-tools-panel" data-tooltip="Editor tools — pencil, eraser, rectangle select, copy, cut, paste.">Tools</button>
          </div>

          <div id="color-options" class="voronoi-options" hidden>
            <div class="section-title">Color Rules</div>
            <label class="field">
              <span>Ruleset</span>
              <select id="color-rule">
                <option value="none" selected>None</option>
                <option value="goethean">Goethean polarity</option>
                <option value="rotation">Generational rotation</option>
              </select>
            </label>
            <label class="range">
              <span>Lightness <strong id="color-lightness-value">50%</strong> <button type="button" class="info-btn" data-tooltip="HSL lightness for live cells. 50% gives the most saturated colors.">?</button></span>
              <input id="color-lightness" type="range" min="10" max="90" value="50" />
            </label>

            <label class="field">
              <span>Death fade steps <button type="button" class="info-btn" data-tooltip="0 = cells die immediately when Conway says so. N>0 means dying cells fade out over N generations (e.g. 3 → drop to 2/3, 1/3, then die). Applies to both rules.">?</button></span>
              <input id="death-fade-steps" type="number" min="0" max="20" value="0" />
            </label>
            <label class="field checkbox" id="freeze-hue-field">
              <span>Freeze hue while dying</span>
              <input id="freeze-hue-dying" type="checkbox" />
            </label>

            <label class="field">
              <span>Ghost fade steps <button type="button" class="info-btn" data-tooltip="0 = no ghost. N>0 means dead cell positions hold a fading colored ghost for N generations. Ghosts don't count toward population.">?</button></span>
              <input id="ghost-fade-steps" type="number" min="0" max="30" value="0" />
            </label>
            <label class="field checkbox">
              <span>Block births on ghosts</span>
              <input id="block-ghost-births" type="checkbox" />
            </label>
            <label class="field checkbox">
              <span>Deaths create holes</span>
              <input id="deaths-create-holes" type="checkbox" />
            </label>

            <div id="color-goethean-options" hidden>
              <div class="field">
                <span>Newborn saturation</span>
                <div class="button-row">
                  <button id="goethean-sat-full" class="seg-btn active" data-tooltip="Newborn cells start at full saturation regardless of parent state.">Full</button>
                  <button id="goethean-sat-inherit" class="seg-btn" data-tooltip="Newborn saturation = average of eligible parents' current saturations.">Inherit</button>
                </div>
              </div>
              <div class="color-legend">
                <span class="swatch" style="background: hsl(30, 80%, 55%)"></span><span>Warm 0–180°</span>
                <span class="swatch" style="background: hsl(240, 70%, 60%)"></span><span>Cool 180–360°</span>
              </div>
            </div>

            <div id="color-rotation-options" hidden>
              <div class="field">
                <span>Newborn hue</span>
                <div class="button-row">
                  <button id="rotation-hue-fixed" class="seg-btn active" data-tooltip="Every newborn cell starts at the configured fixed hue.">Fixed</button>
                  <button id="rotation-hue-parent" class="seg-btn" data-tooltip="Newborn hue = circular mean of all live parents' hues.">Parent avg</button>
                </div>
              </div>
              <label class="field" id="rotation-fixed-hue-field">
                <span>Start hue</span>
                <input id="rotation-fixed-hue" type="color" value="#ff0000" />
              </label>
              <label class="field">
                <span>Rotation / gen (°)</span>
                <input id="rotation-delta" type="number" min="-180" max="180" value="15" />
              </label>
            </div>
          </div>

          <div id="tools-options" class="voronoi-options" hidden>
            <div class="section-title">Tools</div>
            <div class="button-row triple">
              <button id="tool-brush" class="seg-btn active" data-tooltip="Click and drag to toggle cells. The first cell sets the action — tap a live cell to erase, a dead cell to paint.">Brush</button>
              <button id="tool-hole" class="seg-btn" data-tooltip="Click and drag to toggle holes (walls). Cells inside a hole are removed from the simulation and act as edges.">Hole</button>
              <button id="tool-select" class="seg-btn" data-tooltip="Drag a rectangle to select cells.">Select</button>
            </div>
            <label class="range">
              <span>Brush size <strong id="brush-size-value">1</strong> <button type="button" class="info-btn" data-tooltip="Diameter in cells. 1 = single cell; larger sizes paint a disc around the cursor.">?</button></span>
              <input id="brush-size" type="range" min="1" max="10" value="1" />
            </label>
            <label class="field" id="paint-color-field" hidden>
              <span>Paint color <button type="button" class="info-btn" data-tooltip="Hue used for cells you paint with the brush when a color rule is active.">?</button></span>
              <input id="paint-color" type="color" value="#ff0000" />
            </label>
            <div class="button-row triple">
              <button id="tool-copy" disabled data-tooltip="Copy selection to clipboard.">Copy</button>
              <button id="tool-cut" disabled data-tooltip="Copy selection to clipboard, then erase it.">Cut</button>
              <button id="tool-paste" disabled data-tooltip="Stamp the clipboard at the cursor. Click on the canvas to place.">Paste</button>
            </div>
          </div>

          <div class="io-row">
            <label class="file-field">
              <span>Image</span>
              <input id="image-input" type="file" accept="image/*" />
            </label>
            <div class="button-row">
              <button id="swap-colors" data-tooltip="Without color rules: swap alive/dead palette. With color rules: rotate every cell's hue by 180° to its complement on the color wheel.">Swap Colors</button>
              <button id="snapshot-image">Save PNG</button>
            </div>
          </div>

          <footer class="footer-note">
            <span>*~ thanks 4 stopping by ~*</span>
            <span>i luv u<span class="blink">▮</span></span>
          </footer>
        </div>
      </aside>
    </div>

    <script type="module" src="./app.js?v=3"></script>
  </body>
</html>
